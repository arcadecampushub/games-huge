<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Papa's Pizzeria - Bigfoot's Game Shack</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Played with Ruffle. The WAFlash player this page used to import is no
     longer served (its jsDelivr account was blocked), so the game never started. -->
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
ruffle-player { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script>
  var gameConfig = { swfUrl: 'swf/pizzeria.swf' };
</script>
<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@latest/ruffle.js"></script>
<script>
  (function () {
    var player = window.RufflePlayer.newest().createPlayer();
    document.body.appendChild(player);
    player.load({
      url: gameConfig.swfUrl,
      autoplay: "on",
      unmuteOverlay: "visible",
      letterbox: "on",
      scale: "showAll",
      splashScreen: false,
      contextMenu: "off",
      favorLocalstorage: true
    });
    setTimeout(function () { try { player.focus(); } catch (e) {} }, 300);
  })();
</script>
</body>
</html>
